[package]
name = "canalis"
version = "0.6.1"
edition = "2024"
description = "Canalis: control app for the TRYX Panorama cooler screen on Linux and Windows (KANALI replacement)"
license = "MIT"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.6", features = ["derive"] }
eframe = "0.36"
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
resvg = { version = "0.45", default-features = false }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4.10", default-features = false }

[target.'cfg(windows)'.dependencies]
sysinfo = { version = "0.37", default-features = false, features = ["system", "disk", "network"] }
tray-icon = "0.21"
winreg = "0.55"
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(not(windows))'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
libc = "0.2"

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
resvg = { version = "0.45", default-features = false }
winresource = "0.1"

[profile.release]
lto = "thin"
strip = true
